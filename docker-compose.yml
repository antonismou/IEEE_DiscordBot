services:
  bot:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      BOT_CONFIG: /app/config.toml
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
