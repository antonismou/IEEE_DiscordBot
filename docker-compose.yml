services:
  bot:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      BOT_CONFIG: /app/config.toml
      TZ: Europe/Athens
    volumes:
      - ./config.toml:/app/config.toml:ro
      - bot-data:/app/data   # a Docker-managed volume: no folder or owner to set up

volumes:
  bot-data:
